services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command: start-dev --import-realm --http-enabled=true --hostname-strict=false
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=${DB_USE_SSL:-false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}&serverTimezone=${DB_SERVER_TIMEZONE:-UTC}&autoReconnect=${DB_AUTO_RECONNECT:-true}
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_HTTP_PORT:-8180}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=10
        -XX:MaxRAMPercentage=60
        -XX:ActiveProcessorCount=1
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8180}:8080"
    volumes:
      - ./keycloak/mankind-realm.json:/opt/keycloak/data/import/mankind-realm.json
    networks:
      - mankind-network
    healthcheck:
      disable: true
    restart: unless-stopped

  mankind_services:
    build:
      context: .
      dockerfile: mankind_services/Dockerfile
      args:
        MAVEN_OPTS: "-Xmx1024m -XX:MaxMetaspaceSize=512m"
    container_name: mankind_services
    ports:
      - "${SERVER_PORT:-8085}:8085"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8085"
      JAVA_OPTS: "-Xms128m -Xmx1024m -XX:MaxMetaspaceSize=384m"
      SPRING_MAIN_LAZY_INITIALIZATION: "true"
      LOGGING_LEVEL_ROOT: warn
      # Keycloak: token/admin API on Docker network; JWT issuer must match token `iss` (browser URL)
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-http://localhost:8180}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/mankind/protocol/openid-connect/certs
      USER_SERVICE_URL: http://127.0.0.1:8085
      PRODUCT_SERVICE_URL: http://127.0.0.1:8085
      CART_SERVICE_URL: http://127.0.0.1:8085
      COUPON_SERVICE_URL: http://127.0.0.1:8085
      PAYMENT_SERVICE_URL: http://127.0.0.1:8085
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 768M
    networks:
      - mankind-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started

networks:
  mankind-network:
    driver: bridge
