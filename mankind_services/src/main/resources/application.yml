server:
  port: ${SERVER_PORT:8085}

# Keycloak: admin API (login/register) vs JWT issuer validation
keycloak:
  auth-server-url: ${KEYCLOAK_ADMIN_URL:${KEYCLOAK_URL:http://localhost:8180}}
  realm: mankind
  admin-user: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin}
  admin-realm: master
  admin-client-id: admin-cli
  client-id: user-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: mankind_services
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mankind_matrix_db}?connectTimeout=${DB_CONNECT_TIMEOUT:30000}&socketTimeout=${DB_SOCKET_TIMEOUT:30000}&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${DB_SERVER_TIMEZONE:UTC}&autoReconnect=${DB_AUTO_RECONNECT:true}&failOverReadOnly=${DB_FAIL_OVER_READ_ONLY:false}
    username: ${DB_USERNAME:matrix_user}
    password: ${DB_PASSWORD:matrix_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:20000}
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:2}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:120000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:300000}
      leak-detection-threshold: ${DB_HIKARI_LEAK_DETECTION_THRESHOLD:30000}
      connection-test-query: SELECT 1
      validation-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URL:${KEYCLOAK_URL:http://localhost:8180}}/realms/mankind
          jwk-set-uri: ${KEYCLOAK_ISSUER_URL:${KEYCLOAK_URL:http://localhost:8180}}/realms/mankind/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# In-process Feign loopback (single JVM — all point to this server)
USER_SERVICE_URL: ${USER_SERVICE_URL:http://127.0.0.1:8085}
PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:http://127.0.0.1:8085}
CART_SERVICE_URL: ${CART_SERVICE_URL:http://127.0.0.1:8085}
COUPON_SERVICE_URL: ${COUPON_SERVICE_URL:http://127.0.0.1:8085}
PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8085}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  currency: ${STRIPE_CURRENCY:usd}

sms:
  twilio:
    account-sid: ${SMS_ACCOUNT_SID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    phone-number: ${SMS_PHONE_NUMBER:}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  packages-to-scan: com.mankind
  paths-to-match: /**

feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    com.mankind: info
